@media(min-width:601px) and (max-width:900px){.cbm{grid-template-columns:minmax(0,1fr) 210px;gap:12px;padding:12px}.cba{position:sticky;top:76px;left:auto;right:auto;bottom:auto;transform:none;border-radius:18px;max-height:none;overflow:visible;z-index:auto;box-shadow:var(--sh)}.cba .cbx,.cbq{display:none}.cbgrid{grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;max-height:calc(100vh - 330px)}.cbh small{display:block}.cbfs{display:inline-flex}.cbbody{padding:16px 18px}.cbsh{padding:12px 16px}.cbnv{padding:12px 16px 18px}}

/* ===== Panel pelanggaran ujian ===== */
.vw{text-align:center}
.vwi{width:76px;height:76px;margin:-4px auto 12px;border-radius:50%;display:grid;place-items:center;background:#fef3c7;color:#d97706;box-shadow:0 0 0 8px #fef3c766}
.vwi svg{width:42px;height:42px}
.vw.dg .vwi{background:#fee2e2;color:#dc2626;box-shadow:0 0 0 8px #fee2e266}
.vw h3{margin:0 0 6px;font-size:20px;color:#b45309}
.vw.dg h3{color:#b91c1c}
.vwj{display:inline-block;margin:6px 0 12px;padding:8px 14px;border-radius:10px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;font-weight:600;font-size:14px}
.vw.dg .vwj{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.vw p{margin:0 0 14px}
.vdots{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}
.vdots i{width:34px;height:8px;border-radius:99px;background:var(--ln)}
.vdots i.on{background:#f59e0b}
.vw.dg .vdots i.on{background:#dc2626}
.vwb{background:#d97706!important;width:100%;padding:12px}
.vw.dg .vwb,.vl .vwb{background:#dc2626!important}
#md>div:has(.vw){border-top:6px solid #f59e0b}
#md>div:has(.vw.dg){border-top-color:#dc2626}
.vl{max-width:520px;margin:9vh auto;background:var(--in);color:var(--tx);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px #0003;text-align:center;border:1px solid var(--ln)}
.vlh{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;padding:26px 20px 22px}
.vlh .vwi{background:#fff;color:#dc2626;margin:0 auto 12px;box-shadow:0 0 0 8px #ffffff40}
.vlh h2{margin:0;font-size:22px}
.vlh p{margin:6px 0 0;opacity:.95;font-size:14px}
.vlb{padding:20px 22px 24px}
.vst{text-align:left;margin:0 0 14px;padding:12px 14px 12px 32px;background:#fef2f2;border-radius:12px;color:#7f1d1d;font-size:14px}
.vst li{margin:3px 0}
.vseg{display:flex;gap:8px;flex-wrap:wrap}
.vseg button{flex:1;min-width:92px;border:2px solid var(--ln);background:var(--in);color:var(--tx);border-radius:12px;padding:10px 8px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.vseg button b{font-size:20px}
.vseg button small{font-size:11px;color:var(--mu)}
.vseg button.on{border-color:#d97706;background:#fffbeb;color:#92400e}
.vseg button.on small{color:#b45309}
.vpn{display:grid;gap:12px;margin:12px 0}
.vpn>div{border:1px solid var(--ln);border-radius:14px;padding:14px;background:var(--in)}
.vpn .vlk{border-color:#fca5a5;background:#fef2f2;color:#7f1d1d}
.vpn .vlk .mu{color:#991b1b}
.vlr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #fecaca}
.vlh2{display:flex;gap:12px;align-items:flex-start}
.vlh2 .vwi{width:44px;height:44px;margin:0;flex:none;background:#fee2e2;color:#dc2626;box-shadow:none}
.vlh2 .vwi svg{width:26px;height:26px}
.vcode{display:inline-block;font-size:34px;font-weight:800;letter-spacing:.25em;padding:6px 8px 6px 18px;margin:6px 0;color:#b91c1c;background:#fff;border:2px dashed #f87171;border-radius:12px;font-variant-numeric:tabular-nums}
.vlr .vcode{font-size:24px;margin:0}
.vlr .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

// ===== Ujikan kembali (jadwal asesmen) & berikan kembali (tugas) =====
const jrTok=()=>Math.random().toString(36).slice(2,8).toUpperCase();
let JR=null,TR=null;
async function jur(id){return T(async()=>{const[j]=await db.sel('jadwal_asesmen',{id});if(!j)throw new Error('Jadwal tidak ditemukan');
const[rb,sw,ss]=await Promise.all([db.sel('rombel'),db.sel('siswa'),db.sel('sesi_asesmen',{jadwal_id:id})]);JR={j,rb,sw,ss,mode:1};
const pes=sw.filter(s=>!j.rombel_id||s.rombel_id==j.rombel_id),now=new Date();now.setSeconds(0,0);
const st=s=>{const x=ss.find(y=>y.siswa_id==s.id);return x?(x.status=='selesai'?'Selesai'+(x.nilai!=null?' · '+x.nilai:''):x.status=='terkunci'?'Terkunci':'Sedang mengerjakan'):'Belum mulai'};
mo(`<h3>Ujikan Kembali</h3><p class=mu style="margin-top:0"><b>${E(j.judul)}</b> · ${E(nm(rb,j.rombel_id)||'Semua kelas')} · ${ss.filter(x=>x.status=='selesai').length} dari ${pes.length} peserta sudah selesai</p>
<div class=jrm><label class=jro><input type=radio name=jrm value=1 checked onchange="jrMode(1)"><b>Salin sebagai ujian baru</b><small>Hasil ujian lama tetap tersimpan. Disarankan.</small></label><label class=jro><input type=radio name=jrm value=2 onchange="jrMode(2)"><b>Buka kembali ujian ini</b><small>Atur waktu dan token baru. Pilih peserta yang mengulang (remedial).</small></label></div>
<label>Judul</label><input id=jr_j value="${E(j.judul+' (Ujian Ulang)')}">
<div id=jr_rb><label>Rombel</label><select id=jr_r>${rb.map(r=>`<option value=${r.id} ${r.id==j.rombel_id?'selected':''}>${E(r.nama)}</option>`).join('')}</select></div>
<div class=jrg><div><label>Mulai</label><input id=jr_m type=datetime-local value="${lt(now)}"></div><div><label>Dibuka selama (menit)</label><input id=jr_o type=number min=5 value="${Math.max(60,(j.durasi||30)+30)}"></div><div><label>Durasi mengerjakan (menit)</label><input id=jr_d type=number min=1 value="${j.durasi||30}"></div><div><label>Batas pelanggaran</label><select id=jr_p>${[3,2,1].map(n=>`<option ${n==(j.maks_pelanggaran||3)?'selected':''}>${n}</option>`).join('')}</select></div></div>
<label>Token ujian</label><div class=tbr><input id=jr_t value="${jrTok()}" style="flex:1;min-width:120px;text-transform:uppercase"><button class="b l" type=button onclick="$('#jr_t').value=jrTok()">Acak</button></div>
<div id=jr_pes style="display:none"><label>Peserta yang mengulang <small class=mu>(hasil lama peserta yang dicentang dihapus)</small></label><div class=tbr style="margin-bottom:6px"><button class="b l" type=button onclick="jrCk(1)">Semua yang sudah selesai</button><button class="b l" type=button onclick="jrCk(0)">Kosongkan</button></div><div class=jrl>${pes.map(s=>{const x=ss.find(y=>y.siswa_id==s.id);return`<label class=ck><input type=checkbox class=jrc value=${s.id} data-fin=${x&&x.status=='selesai'?1:0} ${x?'':'disabled'}>${E(s.nama)} <span class=tg>${st(s)}</span></label>`}).join('')||'<div class=em>Tidak ada peserta</div>'}</div></div>
<div class=tbr style="margin-top:14px"><button class="b o" onclick="jrGo(1)">Mulai Sekarang</button><button class="b l" onclick="jrGo(0)">Jadwalkan</button><button class="b l" onclick="cm()">Batal</button></div><p class=mu style="margin:8px 0 0;font-size:12px">Mulai Sekarang membuka ujian saat ini. Jadwalkan memakai waktu mulai yang Anda isi.</p>`)})}
function jrMode(m){JR.mode=m;const j=JR.j;$('#jr_j').value=m==1?j.judul+' (Ujian Ulang)':j.judul;$('#jr_j').readOnly=m==2;$('#jr_rb').style.display=m==1?'':'none';$('#jr_pes').style.display=m==2?'':'none'}
const jrCk=a=>document.querySelectorAll('.jrc').forEach(c=>{if(!c.disabled)c.checked=a?c.dataset.fin=='1':false}),
jrGo=now=>T(async()=>{const{j,ss}=JR,v=i=>$('#'+i).value,d=+v('jr_d'),op=+v('jr_o'),mk=+v('jr_p'),tk=(v('jr_t').trim()||jrTok()).toUpperCase();
if(!(d>0))throw new Error('Durasi harus lebih dari 0 menit');if(!(op>0))throw new Error('Lama ujian dibuka harus lebih dari 0 menit');
const m=now?new Date(Date.now()-12e4):new Date(v('jr_m'));if(isNaN(m))throw new Error('Isi waktu mulai');m.setSeconds(0,0);const mulai=m.toISOString(),selesai=new Date((now?Date.now():+m)+op*6e4).toISOString();
if(JR.mode==1){const o={judul:v('jr_j').trim()||j.judul,jenis:j.jenis,paket_id:j.paket_id,rombel_id:+v('jr_r')||j.rombel_id,metode:j.metode||'Online',mulai,selesai,durasi:d,maks_pelanggaran:mk,token:tk};if(U.role=='guru')o.pembuat_id=U.id;const r=await db.ins('jadwal_asesmen',o);cm();rf();setTimeout(()=>jbagi(r.id,1),150)}
else{const ids=[...document.querySelectorAll('.jrc:checked')].map(c=>+c.value);if(ids.length&&!confirm('Hasil ujian lama '+ids.length+' peserta akan dihapus dan mereka dapat mengulang. Lanjutkan?'))return;
await db.upd('jadwal_asesmen',j.id,{mulai,selesai,durasi:d,maks_pelanggaran:mk,token:tk});
for(const sid of ids){const x=ss.find(y=>y.siswa_id==sid);if(!x)continue;try{for(const p of await db.sel('pelanggaran',{sesi_id:x.id}))await db.del('pelanggaran',p.id)}catch(e){}await db.del('sesi_asesmen',x.id)}
cm();rf();setTimeout(()=>jbagi(j.id),150)}});
async function tur(id){return T(async()=>{const[t]=await db.sel('tugas',{id});if(!t)throw new Error('Tugas tidak ditemukan');const[rb,sw,pg]=await Promise.all([db.sel('rombel'),db.sel('siswa'),db.sel('pengumpulan_tugas',{tugas_id:id})]);TR={t,rb,sw,pg,mode:1};
const pes=sw.filter(s=>!t.rombel_id||s.rombel_id==t.rombel_id),dl=new Date(Date.now()+7*864e5);dl.setHours(23,59,0,0);
mo(`<h3>Berikan Tugas Kembali</h3><p class=mu style="margin-top:0"><b>${E(t.judul)}</b> · ${E(nm(rb,t.rombel_id)||'Semua kelas')} · ${pg.length} dari ${pes.length} peserta sudah mengumpulkan</p>
<div class=jrm><label class=jro><input type=radio name=trm value=1 checked onchange="trMode(1)"><b>Salin sebagai tugas baru</b><small>Tugas lama dan nilainya tetap tersimpan. Disarankan.</small></label><label class=jro><input type=radio name=trm value=2 onchange="trMode(2)"><b>Buka kembali tugas ini</b><small>Atur batas waktu baru. Pilih peserta yang mengumpulkan ulang.</small></label></div>
<label>Judul</label><input id=tr_j value="${E(t.judul+' (Ulang)')}">
<div id=tr_rb><label>Rombel</label><select id=tr_r>${rb.map(r=>`<option value=${r.id} ${r.id==t.rombel_id?'selected':''}>${E(r.nama)}</option>`).join('')}</select></div>
<label>Batas waktu pengumpulan</label><input id=tr_b type=datetime-local value="${lt(dl)}"><div class=tbr style="margin:-4px 0 10px"><button class="b l" type=button onclick="trD(1)">+1 hari</button><button class="b l" type=button onclick="trD(3)">+3 hari</button><button class="b l" type=button onclick="trD(7)">+7 hari</button></div>
<div id=tr_pes style="display:none"><label>Peserta yang mengumpulkan ulang <small class=mu>(pengumpulan dan nilai lama peserta yang dicentang dihapus)</small></label><div class=tbr style="margin-bottom:6px"><button class="b l" type=button onclick="trCk(1)">Semua yang sudah mengumpulkan</button><button class="b l" type=button onclick="trCk(0)">Kosongkan</button></div><div class=jrl>${pes.map(s=>{const q=pg.find(y=>y.siswa_id==s.id);return`<label class=ck><input type=checkbox class=trc value=${s.id} ${q?'':'disabled'}>${E(s.nama)} <span class=tg>${q?'Terkumpul'+(q.nilai!=null?' · '+q.nilai:''):'Belum'}</span></label>`}).join('')||'<div class=em>Tidak ada peserta</div>'}</div></div>
<div class=tbr style="margin-top:14px"><button class="b o" onclick="trGo()">Berikan Sekarang</button><button class="b l" onclick="cm()">Batal</button></div>`)})}
function trMode(m){TR.mode=m;const t=TR.t;$('#tr_j').value=m==1?t.judul+' (Ulang)':t.judul;$('#tr_j').readOnly=m==2;$('#tr_rb').style.display=m==1?'':'none';$('#tr_pes').style.display=m==2?'':'none'}
const trD=n=>{const d=new Date(Date.now()+n*864e5);d.setHours(23,59,0,0);$('#tr_b').value=lt(d)},trCk=a=>document.querySelectorAll('.trc').forEach(c=>{if(!c.disabled)c.checked=!!a}),
trGo=()=>T(async()=>{const{t,pg}=TR,b=new Date($('#tr_b').value);if(isNaN(b))throw new Error('Isi batas waktu pengumpulan');
if(TR.mode==1){const o={judul:$('#tr_j').value.trim()||t.judul,topik_id:t.topik_id,rombel_id:+$('#tr_r').value||t.rombel_id,deskripsi:t.deskripsi,batas_waktu:b.toISOString()};if(U.role=='guru')o.pembuat_id=U.id;await db.ins('tugas',o)}
else{const ids=[...document.querySelectorAll('.trc:checked')].map(c=>+c.value);if(ids.length&&!confirm('Pengumpulan dan nilai lama '+ids.length+' peserta akan dihapus. Lanjutkan?'))return;await db.upd('tugas',t.id,{batas_waktu:b.toISOString()});for(const sid of ids){const q=pg.find(y=>y.siswa_id==sid);if(q)await db.del('pengumpulan_tugas',q.id)}}
cm();rf()});
